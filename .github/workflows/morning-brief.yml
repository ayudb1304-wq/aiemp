name: Morning brief

on:
  schedule:
    - cron: "0 3 * * 1-5"   # 08:30 IST, weekdays
  workflow_dispatch:

permissions:
  contents: write

jobs:
  brief:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-sonnet-5' }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
      GSHEET_ID: ${{ vars.GSHEET_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt

      - name: Self-test (no API key needed)
        run: python scripts/selftest.py

      - name: Pull edits made in the Google Sheet
        run: python scripts/sheets.py pull

      - name: Build brief and team digests
        run: python scripts/brief.py >> $GITHUB_STEP_SUMMARY

      - name: Commit briefs, tracker and memory
        run: |
          git config user.name "ai-employee"
          git config user.email "ai-employee@users.noreply.github.com"
          git add briefs tracker memory
          git diff --cached --quiet || git commit -m "brief: $(date -u +%F)"
          git push

      - name: Push brief and tracker to the Google Sheet
        run: |
          python scripts/sheets.py push
          python scripts/sheets.py brief "briefs/$(date -u +%F).md"
