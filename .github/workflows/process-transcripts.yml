name: Process inbox

on:
  push:
    branches: [main]
    paths: ["inbox/**", "context/**", "scripts/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-sonnet-5' }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
      GSHEET_ID: ${{ vars.GSHEET_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt

      - name: Self-test (no API key needed)
        run: python scripts/selftest.py

      - name: Pull edits made in the Google Sheet
        run: python scripts/sheets.py pull

      # Exits non-zero if ANY file failed. The steps below still run (they are not cancelled),
      # so the successes are committed and pushed, and the job shows red in the Actions UI.
      - name: Extract cards, decisions and threads; update tracker
        run: python scripts/extract.py

      - name: Refresh today's calendar blocks
        if: ${{ !cancelled() }}
        env:
          GCAL_ID: ${{ vars.GCAL_ID || secrets.GCAL_ID }}
        run: python scripts/dayplan.py >> $GITHUB_STEP_SUMMARY

      - name: Commit cards, tracker, memory, drafts and logs
        if: ${{ !cancelled() }}
        run: |
          git config user.name "ai-employee"
          git config user.email "ai-employee@users.noreply.github.com"
          git add cards tracker memory drafts logs
          git diff --cached --quiet || git commit -m "cards: process inbox"
          git push

      - name: Push tracker to the Google Sheet
        if: ${{ !cancelled() }}
        run: python scripts/sheets.py push
