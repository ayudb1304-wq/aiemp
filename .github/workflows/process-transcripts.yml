name: Process transcripts

on:
  push:
    paths: ["transcripts/**", "context/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-sonnet-5' }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
      GSHEET_ID: ${{ vars.GSHEET_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt

      - name: Pull edits made in the Google Sheet
        run: python scripts/sheets.py pull

      - name: Extract action cards and update tracker
        run: python scripts/extract.py

      - name: Commit cards and tracker
        run: |
          git config user.name "ai-employee"
          git config user.email "ai-employee@users.noreply.github.com"
          git add cards tracker
          git diff --cached --quiet || git commit -m "cards: process new transcripts"
          git push

      - name: Push tracker to the Google Sheet
        run: python scripts/sheets.py push
