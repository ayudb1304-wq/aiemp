name: Process transcripts

on:
  push:
    paths: ["transcripts/**", "context/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt

      - name: Extract action cards and update tracker
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-sonnet-5' }}
        run: python scripts/extract.py

      - name: Commit cards and tracker
        run: |
          git config user.name "ai-employee"
          git config user.email "ai-employee@users.noreply.github.com"
          git add cards tracker
          git diff --cached --quiet || git commit -m "cards: process new transcripts"
          git push

      - name: Upload tracker to Drive / SharePoint
        if: ${{ env.RCLONE_CONFIG != '' }}
        env:
          RCLONE_CONFIG: ${{ secrets.RCLONE_CONFIG }}
          RCLONE_DEST: ${{ vars.RCLONE_DEST }}
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash
          mkdir -p ~/.config/rclone && printf '%s' "$RCLONE_CONFIG" > ~/.config/rclone/rclone.conf
          rclone copy tracker/actions.xlsx "$RCLONE_DEST" --no-update-modtime
